name: Database CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    name: Database regression suite
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
    steps:
      - name: Check out source and immutable historical fixtures
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install pinned MySQL Community Server 26.7.0 binaries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libaio1 libnuma1
          archive="$RUNNER_TEMP/mysql-26.7.0-linux-glibc2.28-x86_64-minimal.tar.xz"
          curl --fail --location --retry 3 --output "$archive" \
            https://cdn.mysql.com/Downloads/MySQL-26.7/mysql-26.7.0-linux-glibc2.28-x86_64-minimal.tar.xz
          echo "48a747f9e1591905a1e563ddd1c00818352b9201ca0911d66485c08614f4b3c2  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mysql"
          tar --extract --xz --file="$archive" --directory="$RUNNER_TEMP/mysql" --strip-components=1
          echo "MYSQL_BIN=$RUNNER_TEMP/mysql/bin/mysql" >> "$GITHUB_ENV"
          echo "MYSQLD_BIN=$RUNNER_TEMP/mysql/bin/mysqld" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/mysql/bin/mysql" --version
          "$RUNNER_TEMP/mysql/bin/mysqld" --version

      - name: Check Python syntax and pinned database contracts
        shell: bash
        run: |
          git diff --check HEAD^ HEAD
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          import sys

          for path in sorted(Path("scripts").glob("*.py")) + sorted(Path("tests").glob("*.py")):
              ast.parse(path.read_text(), filename=str(path))
          sys.path.insert(0, "scripts")
          from consolidated_baseline import load_contract

          load_contract(Path("sql"), 6)
          load_contract(Path("sql"), 7)
          print("Python syntax, contract checksums, SQL input hashes, and v006 ancestry passed")
          PY

      - name: Run full build, database, and restricted-account regression suite
        # The harness creates private servers, sockets, and generated credentials.
        # It never connects to an existing database or starts the system service.
        run: python3 -B -m unittest discover -s tests -v
